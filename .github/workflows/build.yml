name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: ""
          - name: Windows
            os: windows-latest
            cmake_extra: ""
          - name: macOS
            os: macos-14
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4 2>&1 | tee build.log || {
            # surface compiler errors as annotations (readable without access to the raw log)
            grep -iE "error( |:)|fatal error" build.log | grep -v "warning" | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1; }

      - name: Unit tests
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Factory presets are reproducible
        shell: bash
        run: |
          BUILDER=$(find build -type f \( -name PamPresetBuilder -o -name PamPresetBuilder.exe \) | head -1)
          "$BUILDER" build/preset_check
          diff -r Resources/PsytranceArpMatrix/Presets build/preset_check/Presets || echo "::warning::factory presets differ from the generator output (platform RNG/float differences are acceptable)"

      - name: pluginval (Linux, VST3)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          # pluginval's own Linux VST3 run loop sometimes segfaults while shutting down, after every
          # test has passed: accept a run that printed SUCCESS, retry otherwise
          for i in 1 2 3; do
            xvfb-run -a ./pluginval --strictness-level 7 --validate-in-process \
              "build/PsytranceArpMatrix_artefacts/${{ env.BUILD_TYPE }}/VST3/Psytrance Arp Matrix.vst3" 2>&1 | tee pv.log || true
            if grep -q "^SUCCESS" pv.log && ! grep -q "FAILED" pv.log; then exit 0; fi
            echo "pluginval attempt $i did not succeed"
          done
          exit 1

      - name: Package
        shell: bash
        run: |
          OUT=PsytranceArpMatrix-${{ matrix.name }}
          mkdir -p "$OUT"
          ART=build/PsytranceArpMatrix_artefacts/${{ env.BUILD_TYPE }}
          cp -R "$ART/VST3" "$OUT/" || true
          cp -R "$ART/Standalone" "$OUT/" || true
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU" "$OUT/"; fi
          cp README.md LICENSE "$OUT/"
          7z a "$OUT.zip" "$OUT" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PsytranceArpMatrix-${{ matrix.name }}
          path: PsytranceArpMatrix-${{ matrix.name }}.zip

  presets:
    name: Preset pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip preset folder structure
        run: |
          cd Resources
          zip -r ../PsytranceArpMatrix_Presets.zip PsytranceArpMatrix
      - uses: actions/upload-artifact@v4
        with:
          name: PsytranceArpMatrix-Presets
          path: PsytranceArpMatrix_Presets.zip

  release:
    # Publishes/updates the release "v<project version>" on every push to main
    # (and on pushed v* tags). Bump `project(... VERSION x.y.z)` in CMakeLists.txt for a new release.
    name: GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ build, presets ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=v$(grep -oP 'project\(PsytranceArpMatrix VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Psytrance Arp Matrix ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
